services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waybill
      POSTGRES_PASSWORD: waybill
      POSTGRES_DB: waybill
    ports:
      - "5432:5432"
    volumes:
      - waybill-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waybill -d waybill"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  waybill-postgres:
