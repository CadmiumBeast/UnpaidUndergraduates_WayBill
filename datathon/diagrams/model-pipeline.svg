<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <style>text{font-family:Arial,sans-serif;fill:#17212b} .box{fill:#f4f7fa;stroke:#496b82;stroke-width:2} .task{fill:#e8f1f5;stroke:#2f6f8f;stroke-width:2} .arrow{stroke:#496b82;stroke-width:3;marker-end:url(#a)} .small{font-size:18px} .title{font-size:24px;font-weight:bold}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#496b82"/></marker></defs>
  <text x="40" y="42" class="title">Waypoint Datathon model pipeline</text>
  <rect x="40" y="105" width="220" height="180" rx="14" class="box"/><text x="65" y="145" class="title">Supplied CSVs</text><text x="65" y="185" class="small">training data</text><text x="65" y="215" class="small">general data</text><text x="65" y="245" class="small">test inputs</text>
  <rect x="340" y="105" width="220" height="180" rx="14" class="box"/><text x="365" y="145" class="title">Preparation</text><text x="365" y="185" class="small">joins and labels</text><text x="365" y="215" class="small">time features</text><text x="365" y="245" class="small">leakage controls</text>
  <rect x="640" y="70" width="220" height="100" rx="14" class="task"/><text x="665" y="110" class="title">Task 1</text><text x="665" y="140" class="small">service + late models</text>
  <rect x="640" y="190" width="220" height="100" rx="14" class="task"/><text x="665" y="230" class="title">Task 2A</text><text x="665" y="260" class="small">weekly volume forecast</text>
  <rect x="640" y="310" width="220" height="70" rx="14" class="task"/><text x="665" y="353" class="title">Task 2B allocation</text>
  <rect x="940" y="105" width="220" height="180" rx="14" class="box"/><text x="965" y="145" class="title">Artifacts</text><text x="965" y="185" class="small">exact CSVs</text><text x="965" y="215" class="small">models + metrics</text><text x="965" y="245" class="small">policy report</text>
  <path d="M260 195 H340" class="arrow"/><path d="M560 195 H640" class="arrow"/><path d="M860 195 H940" class="arrow"/><path d="M750 170 V190" class="arrow"/><path d="M750 290 V310" class="arrow"/>
